name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/test.yml

  build:
    name: Build package
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Verify version matches tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        python - <<'PY'
        import ast
        import os
        from pathlib import Path
        import tomllib
        expected = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
        declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        assignments = ast.parse(Path("src/priorityx/__init__.py").read_text()).body
        runtime = next(ast.literal_eval(node.value) for node in assignments
                       if isinstance(node, ast.Assign)
                       and any(isinstance(target, ast.Name) and target.id == "__version__"
                               for target in node.targets))
        if expected != declared or expected != runtime:
            raise SystemExit(f"Version mismatch: tag={expected}, metadata={declared}, runtime={runtime}")
        print(f"Version check passed: {expected}")
        PY

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Build distributions
      run: |
        uv build
        ls -lah dist/

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 1
        if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/priorityx

    permissions:
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        print-hash: true
        attestations: true

  create-release:
    name: Create GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
