name: Tests

on:
  push:
    branches: [main, feature/v0.7.0-autoviz]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          uv run --no-sync python --version
          uv run --no-sync python -m pytest tests/

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Build distributions
        run: uv build

      - name: Install built wheel in place of editable checkout
        run: >-
          uv run --no-sync python -c "import pathlib, subprocess, sys;
          wheel, = pathlib.Path('dist').glob('*.whl');
          subprocess.run(['uv', 'pip', 'install', '--python', sys.executable,
          '--no-deps', '--reinstall', str(wheel)], check=True)"

      - name: Verify installed app, spawned exports and offline browser reopening
        run: >-
          uv run --no-sync python scripts/verify_installed_app.py
          --output dev/tmp/ci-installed-app

      - name: Retain installed-app evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-app-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            dev/tmp/ci-installed-app/*.json
            dev/tmp/ci-installed-app/*.log
            dev/tmp/ci-installed-app/*.png
            dev/tmp/ci-installed-app/*.svg
            dev/tmp/ci-installed-app/exported-workspace.html
            dev/tmp/ci-installed-app/*failure.html
          retention-days: 7
          if-no-files-found: warn
