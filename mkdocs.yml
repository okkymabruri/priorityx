# The GitHub Pages mirror of these docs is RETIRED as of 2026-08-01.
# The Deploy Docs workflow is disabled and the gh-pages branch is deleted.
#
# Do NOT run `mkdocs gh-deploy`. It pushes gh-pages directly, bypassing the
# disabled workflow, and Pages would resume serving a second, stale copy at
# okkymabruri.github.io. Use `mkdocs build` for local preview.
#
# Documentation sources live in docs/. This configuration builds local previews;
# it does not deploy them. Set a canonical site_url only for a verified live route.

site_name: PriorityX
site_description: Generic entity prioritization and transition analysis using GLMM statistical models
repo_url: https://github.com/okkymabruri/priorityx
repo_name: okkymabruri/priorityx

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - AutoViz Example: autoviz-example.md
  - Quick Start: quickstart.md
  - API Reference: api-reference.md
  - Saved Results: saved-results.md
  - Local Workspace: app.md
  - Methodology: methodology.md
  - Priority Classification: priority_classification.md
  - Output Naming: output_naming.md
  - Changelog: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  homepage: https://okky.dev
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/okkymabruri/priorityx
